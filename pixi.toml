# The deck about reproducibility… is itself reproducible.
#
#   pixi install      # one-time, fetch nodejs + pnpm
#   pixi run start    # http://localhost:3030
#   pixi run build    # static site to ./dist
#   pixi run export   # PDF export

[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
nodejs = ">=20"
pnpm = ">=9"

[tasks.install-deps]
cmd = "pnpm install"
inputs = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/.modules.yaml"]

[tasks.start]
cmd = "pnpm run dev"
depends-on = ["install-deps"]
description = "Run the deck locally with hot reload"

[tasks.build]
cmd = "pnpm run build"
depends-on = ["install-deps"]
description = "Build static deck into ./dist"

[tasks.export]
cmd = "pnpm run export"
depends-on = ["install-deps"]
description = "Export the deck to PDF"
